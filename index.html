<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muslim Prayer Times - IslamicHub</title>
    <meta name="description"
        content="Accurate Muslim prayer times for your location. View daily prayers, nafl prayers, and forbidden times with beautiful Islamic design.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="background-pattern"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">🕌</div>
                    <h1 class="app-title">IslamicHub</h1>
                </div>
                <button class="settings-btn" id="tasbeehBtn" aria-label="Tasbeeh Counter">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                        <path d="M12 2v2m0 16v2M2 12h2m16 0h2"></path>
                    </svg>
                </button>
                <button class="settings-btn" id="settingsBtn" aria-label="Settings">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v6m0 6v6m0-6h6M12 7H6m12 5h-6m-6 0H0"></path>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                </button>
            </div>

            <!-- Location Bar -->
            <div class="location-bar">
                <div class="location-info" id="locationInfo">
                    <svg class="location-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span id="locationText">Detecting location...</span>
                </div>
                <button class="change-location-btn" id="changeLocationBtn">Change</button>
            </div>

            <!-- Date and Hijri -->
            <div class="date-section">
                <div class="gregorian-date" id="gregorianDate"></div>
                <div class="hijri-date" id="hijriDate"></div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="prayer-grid">
                <!-- Daily Prayers -->
                <div class="prayer-card daily-prayers">
                    <div class="card-header">
                        <span class="card-icon">🕌</span>
                        <h2 class="card-title">Daily Prayers</h2>
                    </div>
                    <div class="prayer-list" id="dailyPrayers">
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                    </div>
                </div>

                <!-- Nafl Prayers -->
                <div class="prayer-card nafl-prayers">
                    <div class="card-header">
                        <span class="card-icon">✨</span>
                        <h2 class="card-title">Nafl Prayers</h2>
                    </div>
                    <div class="prayer-list" id="naflPrayers">
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                    </div>
                </div>

                <!-- Forbidden Times -->
                <div class="prayer-card forbidden-times">
                    <div class="card-header warning">
                        <span class="card-icon">⚠️</span>
                        <h2 class="card-title">Forbidden (Makrooh)</h2>
                    </div>
                    <div class="prayer-list" id="forbiddenTimes">
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                        <div class="prayer-item loading-shimmer"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" id="closeSettingsBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="calculationMethod">Calculation Method</label>
                    <select id="calculationMethod" class="setting-select">
                        <option value="2">Islamic Society of North America (ISNA)</option>
                        <option value="3" selected>Muslim World League (MWL)</option>
                        <option value="4">Umm Al-Qura University, Makkah</option>
                        <option value="5">Egyptian General Authority of Survey</option>
                        <option value="1">University of Islamic Sciences, Karachi</option>
                        <option value="7">Institute of Geophysics, University of Tehran</option>
                        <option value="8">Gulf Region</option>
                        <option value="9">Kuwait</option>
                        <option value="10">Qatar</option>
                        <option value="11">Majlis Ugama Islam Singapura, Singapore</option>
                        <option value="12">Union Organization islamic de France</option>
                        <option value="13">Diyanet İşleri Başkanlığı, Turkey</option>
                        <option value="14">Spiritual Administration of Muslims of Russia</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="asrMethod">Asr Calculation Method</label>
                    <select id="asrMethod" class="setting-select">
                        <option value="0" selected>Standard (Shafi'i, Maliki, Hanbali)</option>
                        <option value="1">Hanafi</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="timeFormat">Time Format</label>
                    <select id="timeFormat" class="setting-select">
                        <option value="12">12 Hour</option>
                        <option value="24">24 Hour</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Tasbeeh Modal -->
    <div class="modal" id="tasbeehModal">
        <div class="modal-content tasbeeh-modal-content">
            <div class="modal-header tasbeeh-header">
                <button class="back-btn" id="backTasbeehBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <h2>Tasbih</h2>
                <div class="tasbeeh-controls">
                    <button class="control-btn" id="resetTasbeehBtn" title="Reset">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                        </svg>
                    </button>
                    <button class="control-btn" id="soundToggleBtn" title="Toggle Sound">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                            <path class="sound-on" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07">
                            </path>
                        </svg>
                    </button>
                    <button class="control-btn" id="vibrateToggleBtn" title="Toggle Vibration">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="7" y="3" width="10" height="18" rx="2"></rect>
                            <path d="M3 8v8M21 8v8M1 12h2M21 12h2"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="modal-body tasbeeh-enhanced-body" id="tasbeehCountArea">
                <div class="loop-indicator">Loop <span id="loopNumber">1</span></div>

                <div class="count-display-large">
                    <span id="tasbeehCount">0</span>
                    <span class="count-total">/ 33</span>
                </div>

                <div class="beads-container" id="beadsContainer">
                    <!-- Beads will be generated by JavaScript -->
                </div>

                <div class="tap-instruction">Tap anywhere to begin</div>
            </div>

            <div class="dhikr-section">
                <div class="dhikr-header">
                    <span>Dhikr</span>
                    <button class="view-all-btn">View All</button>
                </div>
                <div class="bead-colors">
                    <button class="bead-color active" data-color="black" style="background: #2d2d2d;"></button>
                    <button class="bead-color" data-color="silver"
                        style="background: linear-gradient(135deg, #c0c0c0, #808080);"></button>
                    <button class="bead-color" data-color="gold"
                        style="background: linear-gradient(135deg, #d4af37, #b8941f);"></button>
                    <button class="bead-color" data-color="wood"
                        style="background: linear-gradient(135deg, #8b4513, #654321);"></button>
                    <button class="bead-color" data-color="amber"
                        style="background: linear-gradient(135deg, #ff8c00, #ff6347);"></button>
                    <button class="bead-color" data-color="tiger"
                        style="background: linear-gradient(135deg, #cd853f, #8b4513);"></button>
                    <button class="bead-color" data-color="ruby"
                        style="background: linear-gradient(135deg, #e0115f, #8b0000);"></button>
                </div>
            </div>
